openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Forex Market Structure Analyzer API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: analysis
    description: Forex market analysis operations
  - name: history
    description: Analysis history operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /analysis/{pair}:
    get:
      operationId: getAnalysis
      tags: [analysis]
      summary: Get full market analysis for a currency pair
      description: Returns trend H1, trend M15, entry confidence, checklist, and market summary
      parameters:
        - name: pair
          in: path
          required: true
          schema:
            type: string
            enum: [EURUSD, GBPUSD, USDJPY, XAUUSD, BTCUSD]
          description: Currency pair to analyze
      responses:
        "200":
          description: Market analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketAnalysis"
        "400":
          description: Invalid pair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /analysis/{pair}/history:
    get:
      operationId: getAnalysisHistory
      tags: [history]
      summary: Get analysis history for a currency pair
      description: Returns the last N analysis snapshots stored in the database
      parameters:
        - name: pair
          in: path
          required: true
          schema:
            type: string
            enum: [EURUSD, GBPUSD, USDJPY, XAUUSD, BTCUSD]
          description: Currency pair
      responses:
        "200":
          description: List of historical analysis snapshots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnalysisSnapshot"
        "400":
          description: Invalid pair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /analysis/pairs/summary:
    get:
      operationId: getAllPairsSummary
      tags: [analysis]
      summary: Get summary for all pairs
      description: Returns bias and confidence for every supported pair in one call
      responses:
        "200":
          description: Summary for all pairs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PairSummary"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    TrendData:
      type: object
      description: Trend direction with market structure explanation
      properties:
        direction:
          type: string
          enum: [BUY, SELL]
          description: Trend direction
        structure:
          type: string
          description: Market structure label (e.g. HH-HL or LH-LL)
        explanation:
          type: string
          description: Short description of current market structure
        strength:
          type: string
          enum: [strong, moderate, swing, weak, ranging]
          description: Signal strength based on triple-factor confirmation
        rsi:
          type: number
          description: RSI(14) value at time of analysis
        adx:
          type: number
          description: ADX(14) trend-strength value
        diPlus:
          type: number
          description: Positive directional index (+DI)
        diMinus:
          type: number
          description: Negative directional index (-DI)
        adxSlope:
          type: number
          description: Recent ADX change; negative values indicate weakening trend strength
        emaFast:
          type: number
          description: EMA(20) value
        emaSlow:
          type: number
          description: EMA(50) value
        currentPrice:
          type: number
          description: Last close price used for analysis
        marketState:
          type: string
          enum: [TRENDING, TRANSITION, RANGING]
          description: Whether the timeframe is trending, transitioning, or ranging
        candleTime:
          type: string
          description: Timestamp of the last closed candle used
      required:
        - direction
        - structure
        - explanation
        - strength
        - rsi
        - adx
        - diPlus
        - diMinus
        - adxSlope
        - emaFast
        - emaSlow
        - currentPrice
        - marketState
        - candleTime

    TradeSetup:
      type: object
      description: Optimal trade setup levels — entry zone, SL, and TP targets
      properties:
        direction:
          type: string
          enum: [BUY, SELL]
        status:
          type: string
          enum: [READY, WAIT, CAUTION]
        statusReason:
          type: string
          description: Advisory readiness/risk state; it never blocks a setup
        currentPrice:
          type: number
          description: Last closed candle price
        entryZoneMin:
          type: number
          description: Lower bound of the ideal entry zone
        entryZoneMax:
          type: number
          description: Upper bound of the ideal entry zone
        entryPrice:
          type: number
          description: Reference entry at the zone midpoint
        entryZoneLabel:
          type: string
          description: Status label — e.g. IN ZONE, TUNGGU PULLBACK
        stopLoss:
          type: number
          description: Stop-loss price level
        tp1:
          type: number
          description: Take-profit 1 (up to 1:1 RR, capped by nearby opposing structure)
        tp2:
          type: number
          description: Take-profit 2 (up to 1:2 RR, capped by nearby opposing structure)
        tp3:
          type: number
          description: Take-profit 3 (up to 1:3 RR, capped by nearby opposing structure)
        riskRewardRatio:
          type: number
          description: Planned reward/risk ratio from the entry midpoint to TP2
        riskPoints:
          type: number
          description: Risk in price points (entry zone mid to SL)
        pipSize:
          type: number
          description: Pip/point size for this instrument
      required:
        - direction
        - status
        - statusReason
        - currentPrice
        - entryZoneMin
        - entryZoneMax
        - entryPrice
        - entryZoneLabel
        - stopLoss
        - tp1
        - tp2
        - tp3
        - riskRewardRatio
        - riskPoints
        - pipSize

    ChecklistItem:
      type: object
      description: Single entry analysis condition
      properties:
        label:
          type: string
          description: Human-readable label of the condition
        passed:
          type: boolean
          description: Whether the condition is met
        weight:
          type: number
          description: Weight of this condition in the confidence score (0-1)
      required:
        - label
        - passed
        - weight

    NewsItem:
      type: object
      description: Recent relevant headline used for headline-risk filtering
      properties:
        title:
          type: string
        source:
          type: string
        url:
          type: string
        publishedAt:
          type: string
          format: date-time
        impact:
          type: string
          enum: [HIGH, MEDIUM, LOW]
        matchedKeywords:
          type: array
          items:
            type: string
      required:
        - title
        - source
        - url
        - publishedAt
        - impact
        - matchedKeywords

    EconomicEvent:
      type: object
      description: Scheduled economic-calendar event relevant to the selected pair
      properties:
        title:
          type: string
        country:
          type: string
        scheduledAt:
          type: string
          format: date-time
        impact:
          type: string
          enum: [HIGH, MEDIUM, LOW]
        forecast:
          type: string
        previous:
          type: string
      required:
        - title
        - country
        - scheduledAt
        - impact
        - forecast
        - previous

    NewsRisk:
      type: object
      description: Conservative recent-headline risk state; not a market prediction
      properties:
        status:
          type: string
          enum: [CLEAR, CAUTION, HIGH_RISK, UNAVAILABLE]
        riskScore:
          type: number
          description: Advisory headline risk score from 0 to 100; never a trade gate
        headline:
          type: string
        source:
          type: string
        fetchedAt:
          type: string
          format: date-time
        windowMinutes:
          type: number
        items:
          type: array
          items:
            $ref: "#/components/schemas/NewsItem"
        upcomingEvents:
          type: array
          items:
            $ref: "#/components/schemas/EconomicEvent"
      required:
        - status
        - riskScore
        - headline
        - source
        - fetchedAt
        - windowMinutes
        - items
        - upcomingEvents

    MarketSummary:
      type: object
      description: Overall trading bias summary with a heuristic confluence score
      properties:
        bias:
          type: string
          enum: [BUY, SELL]
        confidence:
          type: number
          description: Heuristic confluence score 0-100; not a win probability
        confidenceLevel:
          type: string
          enum: [High, Medium, Low]
        reason:
          type: string
          description: Multi-line narrative explaining the bias
      required:
        - bias
        - confidence
        - confidenceLevel
        - reason

    MarketAnalysis:
      type: object
      description: Full market analysis response for a pair
      properties:
        pair:
          type: string
          description: Currency pair identifier
        timestamp:
          type: string
          format: date-time
          description: Time when the analysis was generated
        trendH1:
          $ref: "#/components/schemas/TrendData"
        trendM15:
          $ref: "#/components/schemas/TrendData"
        confidence:
          type: number
          description: Heuristic confluence score 0-100; not a win probability
        confidenceLevel:
          type: string
          enum: [High, Medium, Low]
        checklist:
          type: array
          items:
            $ref: "#/components/schemas/ChecklistItem"
        summary:
          $ref: "#/components/schemas/MarketSummary"
        timeframeAligned:
          type: boolean
          description: True only when H1 and M15 are both trending in the same direction
        tradeAllowed:
          type: boolean
          deprecated: true
          description: Legacy compatibility field; always true because analysis never hard-blocks setups. Use note, checklist, score, and tradeSetup.status for advisory context.
        note:
          type: string
          description: Risk-aware explanation of the confidence result
        newsRisk:
          $ref: "#/components/schemas/NewsRisk"
        tradeSetup:
          $ref: "#/components/schemas/TradeSetup"
      required:
        - pair
        - timestamp
        - trendH1
        - trendM15
        - confidence
        - confidenceLevel
        - checklist
        - summary
        - timeframeAligned
        - tradeAllowed
        - note
        - newsRisk
        - tradeSetup

    AnalysisSnapshot:
      type: object
      description: A stored analysis snapshot from history
      properties:
        id:
          type: number
        pair:
          type: string
        timestamp:
          type: string
          format: date-time
        trendH1Direction:
          type: string
          enum: [BUY, SELL]
        trendM15Direction:
          type: string
          enum: [BUY, SELL]
        confidence:
          type: number
        confidenceLevel:
          type: string
          enum: [High, Medium, Low]
        bias:
          type: string
          enum: [BUY, SELL]
      required:
        - id
        - pair
        - timestamp
        - trendH1Direction
        - trendM15Direction
        - confidence
        - confidenceLevel
        - bias

    PairSummary:
      type: object
      description: Quick summary for a single pair
      properties:
        pair:
          type: string
        bias:
          type: string
          enum: [BUY, SELL]
        confidence:
          type: number
        confidenceLevel:
          type: string
          enum: [High, Medium, Low]
        trendH1:
          type: string
          enum: [BUY, SELL]
        trendM15:
          type: string
          enum: [BUY, SELL]
        newsStatus:
          type: string
          enum: [CLEAR, CAUTION, HIGH_RISK, UNAVAILABLE]
        timestamp:
          type: string
          format: date-time
      required:
        - pair
        - bias
        - confidence
        - confidenceLevel
        - trendH1
        - trendM15
        - newsStatus
        - timestamp
