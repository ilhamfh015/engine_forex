kind = "web"
previewPath = "/"
title = "Forex Market Structure Analyzer"
version = "1.0.0"
id = "artifacts/forex-dashboard"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22059

[services.development]
run = "pnpm --filter @workspace/forex-dashboard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/forex-dashboard", "run", "build" ]
serve = "static"
publicDir = "artifacts/forex-dashboard/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22059"
BASE_PATH = "/"
